[project]
name = "langchain-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "eklavya434", email = "eklavyasinha.7@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.3",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.2",
]

[project.scripts]
langchain-app = "langchain_app:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
